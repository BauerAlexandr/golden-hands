<!DOCTYPE html>
<html>
    <HEAD>
        <TITLE>Golden Hands</TITLE>
    </HEAD>
    <BODY>
        <h1>Golden Hands</h1>
        <p>Golden Hands is a game where you have to collect as many coins as possible in a limited time.</p>
        <p>Use the arrow keys to move and collect coins.</p>
        <p>Good luck!</p>
        <p>Score: <span id="score">0</span></p>
        <p>Time: <span id="time">60</span></p>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <script src="game.js"></script>
    </BODY>
</html>

</html>
